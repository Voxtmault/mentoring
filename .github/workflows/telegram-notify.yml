name: Telegram Notification on Push

on:
  push:
    branches:
      - '**'  # This will trigger on pushes to all branches

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
    - name: Send Telegram Notification
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage \
          -d chat_id=${TELEGRAM_CHAT_ID} \
          -d parse_mode=MarkdownV2 \
          -d text="New Commit to ${{ github.repository }}/${{ github.ref_name }}%0A \
          Author: ${{ github.event.head_commit.author.name }}%0A \
          Timestamp: ${{ github.event.head_commit.timestamp }}%0A \
          Message: ${{ github.event.head_commit.message }}"